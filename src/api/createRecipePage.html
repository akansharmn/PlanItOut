<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize Material Design Components
        const textFields = document.querySelectorAll('.mdc-text-field');
        textFields.forEach(textField => {
            mdc.textField.MDCTextField.attachTo(textField);
        });

        const buttons = document.querySelectorAll('.mdc-button');
        buttons.forEach(button => {
            mdc.ripple.MDCRipple.attachTo(button);
        });

        // Initialize snackbar
        const snackbar = mdc.snackbar.MDCSnackbar.attachTo(document.querySelector('.mdc-snackbar'));

        window.handleFormSubmit = function(event) {
            const status = event.detail.successful;
            const xhr = event.detail.xhr;

            if (status) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    if (response.status === 'success') {
                        document.querySelector('.mdc-snackbar__label').textContent = 'Recipe added successfully!';
                        snackbar.open();
                        document.getElementById('recipe-form').reset();
                    } else {
                        document.querySelector('.mdc-snackbar__label').textContent = 'Error: ' + response.message;
                        snackbar.open();
                    }
                } catch (e) {
                    document.querySelector('.mdc-snackbar__label').textContent = 'Error processing response';
                    snackbar.open();
                }
            } else {
                document.querySelector('.mdc-snackbar__label').textContent = 'Error: Failed to submit form';
                snackbar.open();
            }
        };
    });
</script>
